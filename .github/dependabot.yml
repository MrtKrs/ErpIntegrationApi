version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      minor-and-patches:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      microsoft-core:
        patterns:
          - "Microsoft.*"
          - "System.*"
